<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: yellow;
        }
        .cont > div {
            width: 100px;
            height: 100px;
        }
        .relative {
            background-color: green;
            position: relative;
            top: 10px;
            left: 10px;
        }
        .absolute {
            background-color: red;
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .fixed {
            background-color: aqua;
            position: fixed;
            top: 0;
            right: 10px;
        }
        .sticky {
            background-color: pink;
            position: sticky;
            top: 100px;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="sticky">sticky</div>
    </div>
    <div class="cont">
        <div class="relative">relatives</div>
    </div>
    <div class="cont">
        <div class="absolute">absolute</div>
    </div>
    <div class="cont">
        <div class="fixed">fixed</div>
    </div>
</body>
</html>
