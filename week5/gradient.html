<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear {
            width: 200px;
            height: 200px;
            background: linear-gradient(to left, white, blue)
        }

        .radical {
            width: 400px;
            height: 200px;
            background: radial-gradient(circle, yellow, red);
        }
    </style>
</head>
<body>
    <div class="linear">선형 그라데이션</div>
    <div class="radical">방사형 그라데이션</div>
</body>
</html>
