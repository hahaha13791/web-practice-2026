<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a {
            display: block;
            width: 100px;
            height: 100px;
            background-color: gold;
        }
        div {
            display: inline;
            width: 100px;
            height: 100px;
            background-color: pink;
        }
        p {
            display: inline-block;
            width: 100px;
            height: 100px;
            background-color: green;
        }
    </style>
</head>
<body>
    <a href="a">인라인 요소 -> 블록 요소</a>
    <div>블록 요소 -> 인라인 요소</div>
    <hr>
    <p>블록 요소</p>
    <p>블록 요소</p>
    <p>블록 요소</p>
</body>
</html>
