<!DOCTYPE html>
<html lang="en">
<head>

    <title>3주차 실습미션</title>
    <meta property="og:title" content="3주차 실습미션">

            height="150" width="150">
    </header>
    <main>
        <fieldset>
            <legend>문의하기</legend>
            <label for="id">이름</label>
            <input type="text" id="id" required>
            <br>

            <label for="email">이메일</label>
            <input type="email" id="email" required>
            <br>

            <label for="2">문의유형</label>
            <select id="2">
                <option value="a" selected>상담</option>
                <option value="b">협업요청</option>
                <option value="c">기타</option>
            </select>
            <br>

            <label for="1">문의내용</label>
            <textarea id="1" required></textarea>
            <br>

            <button type="submit">보내기</button>
        </fieldset>
    </main>
    <footer>
    <p>© copyright. All rights reserved</p>
