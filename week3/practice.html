    <h3>폼 태그</h3>
    <fieldset>
        <legend>인풋 태그</legend>
        <label for="id">아이디</label>
        <input type="text" id="id" />
        
        <label for="password">비밀번호</label>

        <label for="email">이메일</label>
        <input type="email" id="email" />

        <input type="tel" id="tel" />

        <h3>라디오 버튼 (좋아하는 과일을 1가지만 선택하세요)</h3>

        <input type="radio" id="apple" name="fruit">
        <label for="apple">바나나</label>
        <input type="radio" id="banana" name="fruit">

            <option value="a">배송</option>
            <option value="b" selected>주문</option>
            <option value="c">기타</option>
        </select>

        <button type="button">클릭</button>
